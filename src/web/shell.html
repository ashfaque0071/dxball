<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DX Ball — Wizarding World</title>
<style>
  :root {
    --ink: #0a0810;
    --panel: #130f1c;
    --brass: #d8b26a;
    --text: #cdc3dd;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    /* The game is driven entirely by the canvas, so the page itself must never
       scroll: arrow keys and space would otherwise move the document. */
    overflow: hidden;
    background: var(--ink);
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    background:
      radial-gradient(ellipse at 50% 0%, #1d1630 0%, transparent 62%),
      var(--ink);
  }

  #frame {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }

  /* The canvas keeps a fixed 1200x900 backbuffer. Its CSS size is computed in
     JS so the element box stays exactly 4:3 -- Emscripten maps pointer events
     with canvas.width / rect.width, so an element box of a different shape
     would misplace every click. */
  #canvas {
    display: block;
    background: #000;
    outline: none;
    border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(216, 178, 106, 0.28), 0 18px 48px rgba(0, 0, 0, 0.6);
    /* Fallback shape for the first paint, before fitCanvas() runs. */
    aspect-ratio: 4 / 3;
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
  }

  #asset-status {
    position: fixed;
    bottom: max(8px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    color: var(--brass);
    font-size: 12px;
    pointer-events: none;
  }

  #name-form {
    position: absolute;
    z-index: 3;
    margin: 0;
    padding: 0;
  }
  #name-form[hidden] { display: none; }
  #name-form input {
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
    color: transparent;
    caret-color: transparent;
    opacity: 0.02;
    font-size: 20px;
    touch-action: manipulation;
  }

  /* Loading overlay */
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--ink);
    z-index: 10;
    transition: opacity 320ms ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }

  #loading h1 {
    margin: 0;
    font-size: clamp(18px, 4vw, 30px);
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--brass);
  }

  #track {
    width: min(320px, 68vw);
    height: 5px;
    border-radius: 999px;
    background: #241c38;
    overflow: hidden;
  }
  #fill {
    height: 100%;
    width: 8%;
    border-radius: 999px;
    background: linear-gradient(90deg, #8d6bd0, var(--brass));
    transition: width 220ms ease;
  }
  #status { font-size: 12.5px; opacity: 0.72; min-height: 1.2em; }
  #status.error { color: #ff9e9e; opacity: 1; }

</style>
</head>
<body>

<div id="frame">
  <canvas id="canvas" width="1200" height="900" tabindex="0"
          aria-label="DX Ball game screen"
          oncontextmenu="event.preventDefault()"></canvas>
  <form id="name-form" hidden>
    <input id="mobile-name" aria-label="Wizard name" maxlength="12"
           autocomplete="off" autocapitalize="characters" enterkeyhint="done"
           spellcheck="false">
  </form>
</div>

<span id="asset-status" hidden></span>

<div id="loading">
  <h1>DX Ball</h1>
  <div id="track"><div id="fill"></div></div>
  <div id="status">Loading…</div>
</div>

<script>
(function () {
  var canvas = document.getElementById("canvas");
  var frame = document.getElementById("frame");
  var loading = document.getElementById("loading");
  var fill = document.getElementById("fill");
  var statusEl = document.getElementById("status");
  var assetStatus = document.getElementById("asset-status");
  var nameForm = document.getElementById("name-form");
  var nameInput = document.getElementById("mobile-name");
  var runtimeInitialized = false;
  var resolveRuntime;
  var runtimeReady = new Promise(function (resolve) { resolveRuntime = resolve; });

  /* The menu has its own small bootstrap bundle. Fetch the first chamber after
     the menu is visible, then the later chambers. */
  async function fetchAssetPackage(name, cacheMode) {
    var metaResponse = await fetch(name + ".json", { cache: "no-cache" });
    if (!metaResponse.ok) throw new Error("Asset list: HTTP " + metaResponse.status);
    var meta = await metaResponse.json();
    var response = await fetch(name + ".data?v=" + meta.sha256, { cache: cacheMode });
    if (!response.ok) throw new Error("Artwork: HTTP " + response.status);

    var bytes = new Uint8Array(meta.size);
    if (response.body && response.body.getReader) {
      var reader = response.body.getReader();
      var offset = 0;
      while (true) {
        var part = await reader.read();
        if (part.done) break;
        if (offset + part.value.length > bytes.length) throw new Error("Artwork is too large");
        bytes.set(part.value, offset);
        offset += part.value.length;
        var percent = Math.round(offset / bytes.length * 100);
        if (name === "core") Module._dxballCoreStatus(percent, 0);
        else Module._dxballAssetsStatus(percent, 0);
        assetStatus.textContent = (name === "core" ? "Loading game " : "More chambers ") + percent + "%";
      }
      if (offset !== bytes.length) throw new Error("Artwork is incomplete");
    } else {
      var complete = new Uint8Array(await response.arrayBuffer());
      if (complete.length !== bytes.length) throw new Error("Artwork size mismatch");
      bytes.set(complete);
      if (name === "core") Module._dxballCoreStatus(100, 0);
      else Module._dxballAssetsStatus(100, 0);
    }

    if (window.crypto && window.crypto.subtle) {
      var digest = await window.crypto.subtle.digest("SHA-256", bytes);
      var actual = Array.from(new Uint8Array(digest), function (n) {
        return n.toString(16).padStart(2, "0");
      }).join("");
      if (actual !== meta.sha256) throw new Error("Artwork checksum mismatch");
    }

    await runtimeReady;
    for (var i = 0; i < meta.files.length; i++) {
      var file = meta.files[i];
      var directory = file.path.slice(0, file.path.lastIndexOf("/"));
      Module.FS.mkdirTree(directory);
      Module.FS.writeFile(file.path, bytes.subarray(file.start, file.end));
    }
    if (name === "core") Module._dxballCoreReady();
    else Module._dxballAssetsReady();
  }

  async function loadAssetPackage(name) {
    assetStatus.hidden = false;
    assetStatus.textContent = name === "core" ? "Loading game 0%" : "More chambers 0%";
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        await fetchAssetPackage(name, attempt === 0 ? "force-cache" : "reload");
        return true;
      } catch (error) {
        console.warn("dxball: " + name + " download failed.", error);
      }
    }
    if (name === "core") Module._dxballCoreStatus(0, 1);
    else Module._dxballAssetsStatus(0, 1);
    assetStatus.textContent = "Game download failed; reload to retry";
    return false;
  }

  async function loadGamePackages() {
    if (await loadAssetPackage("core")) {
      if (await loadAssetPackage("deferred")) assetStatus.hidden = true;
    }
  }

  /* ---- Phone and tablet input ------------------------------------------
     Pointer coordinates are converted straight to the 800x600 game design
     space. Touch release makes a menu tap; dragging moves the paddle without
     accidentally launching the ball. */
  var activeTouch = null;
  var touchStartX = 0;
  var touchStartY = 0;
  var touchStartTime = 0;
  var mobileLoopStarted = false;

  function enableTouchUi() {
    if (!document.body.classList.contains("touch-device"))
      document.body.classList.add("touch-device");
    if (runtimeInitialized) {
      Module._dxballTouchMode(1);
      if (!mobileLoopStarted) {
        mobileLoopStarted = true;
        requestAnimationFrame(syncMobileUi);
      }
    }
    positionNameField();
  }

  function touchPoint(event) {
    var rect = canvas.getBoundingClientRect();
    return [Math.round((event.clientX - rect.left) * 800 / rect.width),
            Math.round((event.clientY - rect.top) * 600 / rect.height)];
  }

  function sendTouch(phase, event, tap) {
    if (!runtimeInitialized) return;
    var point = touchPoint(event);
    Module._dxballTouchPointer(phase, point[0], point[1], tap ? 1 : 0);
  }

  canvas.addEventListener("pointerdown", function (event) {
    if (event.pointerType === "mouse") return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if (activeTouch !== null) return;
    enableTouchUi();
    activeTouch = event.pointerId;
    touchStartX = event.clientX;
    touchStartY = event.clientY;
    touchStartTime = performance.now();
    canvas.setPointerCapture(event.pointerId);
    sendTouch(0, event, false);
  }, { capture: true, passive: false });

  canvas.addEventListener("pointermove", function (event) {
    if (event.pointerId !== activeTouch) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    sendTouch(1, event, false);
  }, { capture: true, passive: false });

  function finishTouch(event, cancelled) {
    if (event.pointerId !== activeTouch) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    var distance = Math.hypot(event.clientX - touchStartX, event.clientY - touchStartY);
    var tap = !cancelled && distance < 16 && performance.now() - touchStartTime < 650;
    sendTouch(cancelled ? 3 : 2, event, tap);
    activeTouch = null;
  }
  canvas.addEventListener("pointerup", function (event) {
    finishTouch(event, false);
  }, { capture: true, passive: false });
  canvas.addEventListener("pointercancel", function (event) {
    finishTouch(event, true);
  }, { capture: true, passive: false });

  ["touchstart", "touchmove", "touchend", "touchcancel"].forEach(function (type) {
    canvas.addEventListener(type, function (event) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }, { capture: true, passive: false });
  });

  function syncMobileUi() {
    var naming = !!Module._dxballMobileState();
    if (nameForm.hidden === naming) {
      nameForm.hidden = !naming;
      if (naming) {
        nameInput.value = "";
      } else {
        nameInput.blur();
      }
      positionNameField();
    }
    requestAnimationFrame(syncMobileUi);
  }

  nameInput.addEventListener("input", function () {
    var clean = nameInput.value.replace(/[^a-z0-9]/gi, "").slice(0, 12);
    if (nameInput.value !== clean) nameInput.value = clean;
    if (runtimeInitialized) Module.ccall("dxballMobileSetName", null, ["string"], [clean]);
  });
  nameInput.addEventListener("keydown", function (event) {
    event.stopPropagation();
  });
  nameForm.addEventListener("submit", function (event) {
    event.preventDefault();
    if (!runtimeInitialized) return;
    Module.ccall("dxballMobileName", null, ["string"], [nameInput.value]);
    nameInput.blur();
    canvas.focus();
  });

  function positionNameField() {
    if (!document.body.classList.contains("touch-device")) return;
    var rect = canvas.getBoundingClientRect();
    var box = frame.getBoundingClientRect();
    nameForm.style.width = (rect.width * 300 / 800) + "px";
    nameForm.style.height = (rect.height * 56 / 600) + "px";
    nameForm.style.left = (rect.left - box.left + rect.width * 250 / 800) + "px";
    nameForm.style.top = (rect.top - box.top + rect.height * 274 / 600) + "px";
  }

  if (window.matchMedia("(pointer: coarse)").matches ||
      navigator.maxTouchPoints > 0 || window.innerWidth <= 600)
    enableTouchUi();

  /* ---- Responsive 4:3 sizing -------------------------------------------
     The canvas keeps its 1200x900 backbuffer at every display size; only the
     CSS box changes, so the game never distorts and never re-allocates its
     render target. */
  function fitCanvas() {
    if (window.innerWidth <= 600 && !document.body.classList.contains("touch-device"))
      enableTouchUi();
    var cs = window.getComputedStyle(frame);
    var w = frame.clientWidth -
            parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var h = frame.clientHeight -
            parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);

    var scale = Math.min(w / 4, h / 3);
    if (!(scale > 0)) return;

    var width = Math.floor(scale * 4) + "px";
    var height = Math.floor(scale * 3) + "px";

    /* Written only when they actually differ. This function is also driven by
       a MutationObserver on the canvas's own attributes, so assigning
       unconditionally would retrigger it forever. */
    if (canvas.style.width !== width) canvas.style.width = width;
    if (canvas.style.height !== height) canvas.style.height = height;

    /* The stylesheet's max-width/max-height are only a pre-script fallback.
       Left in place they would clamp one axis of the size computed here and
       stretch the picture, so they are dropped once this runs. */
    if (canvas.style.maxWidth !== "none") canvas.style.maxWidth = "none";
    if (canvas.style.maxHeight !== "none") canvas.style.maxHeight = "none";
    positionNameField();
  }

  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);
  if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(frame);

  /* Emscripten sizes the canvas itself whenever raylib creates or resizes the
     window, and its updateCanvasDimensions() does
     canvas.style.removeProperty('width'/'height'). That runs after the first
     fitCanvas() call, which would otherwise leave the element at its raw
     1200x900 backbuffer size and overflow the page. Watching the canvas's own
     attributes puts the fitted size back each time. */
  if (window.MutationObserver) {
    new MutationObserver(fitCanvas).observe(canvas, {
      attributes: true,
      attributeFilter: ["style", "width", "height"]
    });
  }

  fitCanvas();

  /* ---- Keep input on the canvas ---------------------------------------- */
  canvas.addEventListener("mousedown", function () { canvas.focus(); });
  window.addEventListener("load", function () { canvas.focus(); });

  /* Arrow keys and space scroll a document by default. The page is already
     overflow:hidden, but an itch.io iframe is not, so swallow them too. */
  var swallowed = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
                   "Space", "PageUp", "PageDown", "Home", "End"];
  window.addEventListener("keydown", function (e) {
    if (swallowed.indexOf(e.code) !== -1) e.preventDefault();
  }, { passive: false });

  /* ---- Audio unlock ----------------------------------------------------
     miniaudio (raylib's audio backend) already installs its own "click" and
     "touchend" listeners to resume the suspended AudioContext. It does not
     watch the keyboard, so a player who only ever presses keys would get no
     sound; this covers that case. The game itself never blocks on audio -- a
     suspended context just stays silent until it is resumed. */
  function unlockAudio() {
    try {
      if (window.miniaudio && typeof window.miniaudio.unlock === "function") {
        window.miniaudio.unlock();
      }
    } catch (e) {
      console.warn("dxball: could not resume audio.", e);
    }
  }
  window.addEventListener("keydown", unlockAudio, true);
  window.addEventListener("pointerdown", unlockAudio, true);

  /* ---- Loading indicator ---------------------------------------------- */
  var finished = false;
  function finishLoading() {
    if (finished) return;
    finished = true;
    fill.style.width = "100%";
    statusEl.textContent = "Ready";
    loading.classList.add("done");
    setTimeout(function () { loading.hidden = true; }, 400);
    fitCanvas();
    canvas.focus();
  }

  var Module = {
    canvas: canvas,
    print: function (text) { console.log(text); },
    printErr: function (text) { console.error(text); },

    setStatus: function (text) {
      if (finished) return;
      if (!text) { finishLoading(); return; }

      /* Emscripten reports download progress as "... (12345/67890)". */
      var m = /\((\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)\)/.exec(text);
      if (m) {
        var done = parseFloat(m[1]);
        var total = parseFloat(m[2]);
        if (total > 0) {
          var pct = Math.max(4, Math.min(99, (done / total) * 100));
          fill.style.width = pct.toFixed(1) + "%";
        }
        statusEl.textContent = "Loading game data… " +
          (total > 0 ? Math.round((done / total) * 100) + "%" : "");
      } else {
        statusEl.textContent = text;
      }
    },

    totalDependencies: 0,
    monitorRunDependencies: function (left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      if (left === 0) {
        Module.setStatus("");
      } else {
        Module.setStatus("Preparing… (" +
          (this.totalDependencies - left) + "/" + this.totalDependencies + ")");
      }
    },

    onRuntimeInitialized: function () {
      runtimeInitialized = true;
      finishLoading();
      resolveRuntime();
      if (document.body.classList.contains("touch-device")) enableTouchUi();
      /* Give the startup package full network priority until it is ready. */
      loadGamePackages();
    }
  };

  window.Module = Module;

  window.addEventListener("error", function (e) {
    if (finished) return;
    statusEl.className = "error";
    statusEl.textContent = "Failed to start: " + (e.message || "unknown error");
  });

  canvas.addEventListener("webglcontextlost", function (e) {
    e.preventDefault();
    alert("The graphics context was lost. Please reload the page.");
  }, false);
})();
</script>

{{{ SCRIPT }}}

</body>
</html>
